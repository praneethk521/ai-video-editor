name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt
      - name: Run API tests
        working-directory: apps/api
        run: pytest

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        working-directory: apps/worker
        run: pip install -r requirements-dev.txt
      - name: Run worker tests
        working-directory: apps/worker
        run: pytest

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Build web
        working-directory: apps/web
        run: npm run build

  shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell script syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts -type f -name "*.sh" | sort)
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  infra-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose config
        run: |
          cp .env.example .env
          docker compose -f infra/docker/docker-compose.yml config >/tmp/compose-config.yml
          docker compose --env-file .env \
            -f infra/docker/docker-compose.yml \
            -f infra/observability/docker-compose.observability.yml \
            config >/tmp/observability-compose-config.yml
          rm .env
      - name: Validate Kubernetes YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_stream(File.read(f)); puts "ok #{f}" }' infra/k8s/*.yaml
      - name: Validate observability configuration
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_stream(File.read(f)); puts "ok #{f}" }' \
            infra/observability/*.yaml infra/observability/grafana/provisioning/*/*.yaml
          jq empty infra/observability/grafana/dashboards/*.json
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/observability:/etc/prometheus:ro" \
            -v /dev/null:/run/ai-video-editor/metrics-token:ro \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yaml
          docker run --rm \
            -v "$PWD/infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.158.0 \
            validate --config=/etc/otelcol-contrib/config.yaml
          docker run --rm \
            -e OTEL_COLLECTOR_BEARER_TOKEN=test-collector-token \
            -e OTEL_TRACES_BACKEND_ENDPOINT=traces.example.internal:4317 \
            -e OTEL_TRACES_BACKEND_AUTHORIZATION="Bearer test-backend-token" \
            -e OTEL_TRACES_BACKEND_INSECURE=false \
            -v "$PWD/infra/observability/otel-collector-kubernetes.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.158.0 \
            validate --config=/etc/otelcol-contrib/config.yaml
