name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt
      - name: Run API tests
        working-directory: apps/api
        run: python -m pytest
      - name: Lint API
        working-directory: apps/api
        run: python -m ruff check app tests

  worker-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/packages/shared/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        working-directory: apps/worker
        run: pip install -r requirements-dev.txt
      - name: Install real render dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run worker tests
        working-directory: apps/worker
        run: python -m pytest
      - name: Lint worker
        working-directory: apps/worker
        run: python -m ruff check app tests

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Build web
        working-directory: apps/web
        run: npm run build
      - name: Audit web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit API dependencies
        run: pip-audit -r apps/api/requirements.txt
      - name: Audit worker dependencies
        run: pip-audit -r apps/worker/requirements.txt

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --log-opts=--all
          --gitleaks-ignore-path=/repo/.gitleaksignore
      - name: Scan repository for committed secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          aquasec/trivy:0.74.0
          fs --scanners secret --exit-code 1 /repo
      - name: Build runtime images
        run: |
          docker build -t ai-video-editor-api:ci -f apps/api/Dockerfile .
          docker build -t ai-video-editor-worker:ci -f apps/worker/Dockerfile .
      - name: Verify non-root runtime imports
        run: |
          test "$(docker image inspect ai-video-editor-api:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect ai-video-editor-worker:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --read-only --tmpfs /tmp:rw,size=64m ai-video-editor-api:ci \
            python -c 'import app.main; print(app.main.app.title)'
          docker run --rm --read-only --tmpfs /tmp:rw,size=64m ai-video-editor-worker:ci \
            python -c 'import app.render; print(app.render.VideoRenderer.__name__)'
      - name: Scan runtime images
        run: |
          docker run --rm -v trivy-cache:/root/.cache -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            ai-video-editor-api:ci
          docker run --rm -v trivy-cache:/root/.cache -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            ai-video-editor-worker:ci

  shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell script syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts -type f -name "*.sh" | sort)
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  infra-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Docker Compose config
        run: |
          cp .env.example .env
          docker compose -f infra/docker/docker-compose.yml config >/tmp/compose-config.yml
          docker compose --env-file .env \
            -f infra/docker/docker-compose.yml \
            -f infra/observability/docker-compose.observability.yml \
            config >/tmp/observability-compose-config.yml
          rm .env
      - name: Validate Kubernetes YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_stream(File.read(f)); puts "ok #{f}" }' infra/k8s/*.yaml
      - name: Validate observability configuration
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_stream(File.read(f)); puts "ok #{f}" }' \
            infra/observability/*.yaml infra/observability/grafana/provisioning/*/*.yaml
          jq empty infra/observability/grafana/dashboards/*.json
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/observability:/etc/prometheus:ro" \
            -v /dev/null:/run/ai-video-editor/metrics-token:ro \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yaml
          docker run --rm \
            -v "$PWD/infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.158.0 \
            validate --config=/etc/otelcol-contrib/config.yaml
          docker run --rm \
            -e OTEL_COLLECTOR_BEARER_TOKEN=test-collector-token \
            -e OTEL_TRACES_BACKEND_ENDPOINT=traces.example.internal:4317 \
            -e OTEL_TRACES_BACKEND_AUTHORIZATION="Bearer test-backend-token" \
            -e OTEL_TRACES_BACKEND_INSECURE=false \
            -v "$PWD/infra/observability/otel-collector-kubernetes.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.158.0 \
            validate --config=/etc/otelcol-contrib/config.yaml
