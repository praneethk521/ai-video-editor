global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/prometheus-alerts.yaml

scrape_configs:
  - job_name: ai-video-api
    metrics_path: /metrics
    bearer_token_file: /run/ai-video-editor/metrics-token
    static_configs:
      - targets: ["api:8000"]

  - job_name: ai-video-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
