extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth/server:
    token: ${env:OTEL_COLLECTOR_BEARER_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth/server
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/server

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "url.path")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "http.target")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  otlp/backend:
    endpoint: ${env:OTEL_TRACES_BACKEND_ENDPOINT}
    headers:
      authorization: ${env:OTEL_TRACES_BACKEND_AUTHORIZATION}
    tls:
      insecure: ${env:OTEL_TRACES_BACKEND_INSECURE}

service:
  extensions: [health_check, bearertokenauth/server]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp/backend]
