apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-video-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-video-worker
  template:
    metadata:
      labels:
        app: ai-video-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: worker
          image: ghcr.io/OWNER/ai-video-editor-worker:latest
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - secretRef:
                name: ai-video-worker-secrets
          env:
            - name: VIDEO_TEMP_ROOT
              value: /tmp/ai-video-editor
            - name: OUTPUT_DELIVERY_LOCAL_ROOT
              value: /tmp/ai-video-editor/outputs
            - name: WORKER_METRICS_PORT
              value: "9100"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/ai-video-editor/prometheus
          volumeMounts:
            - name: temp-media
              mountPath: /tmp
            - name: output-staging
              mountPath: /tmp/ai-video-editor
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: temp-media
          emptyDir:
            sizeLimit: 20Gi
        - name: output-staging
          persistentVolumeClaim:
            claimName: ai-video-output-staging
