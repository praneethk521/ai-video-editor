name: ai-video-local
services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - queue:/data
  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    volumes:
      - signatures:/var/lib/clamav
    healthcheck:
      test: [CMD, clamdscan, --ping, "1"]
      interval: 15s
      timeout: 5s
      retries: 30
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment: &environment
      APP_ENV: local
      API_TOKEN: ${API_TOKEN:-dev-only-token}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_PHOTOS_REDIRECT_URI: http://localhost:8001/oauth/google-photos/callback
      DATABASE_URL: sqlite+pysqlite:////tmp/ai-video-editor/local.sqlite3
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: clamav
      LOCAL_VISION_ENABLED: "true"
      LOCAL_VISION_URL: http://host.docker.internal:11434
      LOCAL_VISION_MODEL: qwen2.5vl:7b
      MAX_UPLOAD_BYTES: "104857600"
      OUTPUT_STORAGE_PROVIDER: local_private
      MEDIA_SOURCE_ROOT: /tmp/ai-video-editor/sources
      OUTPUT_DELIVERY_LOCAL_ROOT: /tmp/ai-video-editor/outputs
      TRUSTED_HOSTS: localhost,127.0.0.1,api,host.docker.internal
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - media:/tmp/ai-video-editor
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      redis:
        condition: service_started
      clamav:
        condition: service_healthy
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *environment
      API_BASE_URL: http://api:8000
      RENDER_DRY_RUN: "false"
      VIDEO_TEMP_ROOT: /tmp/ai-video-editor
      MAX_RENDER_JOB_SECONDS: "1800"
    volumes:
      - media:/tmp/ai-video-editor
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on: [api]
volumes:
  media:
  queue:
  signatures:
